<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecosystem-architecture-title ecosystem-architecture-desc" id="ecosystem-architecture-root">
        <title id="ecosystem-architecture-title">Robo Market Search Ecosystem Architecture</title>
        <desc id="ecosystem-architecture-desc">Left-to-right system architecture showing clients routing through FastAPI and the BYOK Agent into UnifiedSearchClient, which fans out live requests across 6 Turkish electronics stores.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ecosystem-architecture-root { --color-paper:      #060913;
      --color-paper-2:    #0F172A;
      --color-ink:        #F8FAFC;
      --color-muted:      #94A3B8;
      --color-soft:       #7C8EA6;
      --color-rule:       rgba(248, 250, 252, 0.14);
      --color-rule-solid: rgba(148, 163, 184, 0.32);
      --color-accent:     #00F0FF;
      --color-accent-tint:rgba(0, 240, 255, 0.08);
      --color-link:       #38BDF8;
      --font-sans:        'Geist', system-ui, sans-serif;
      --font-serif:       'Instrument Serif', serif;
      --font-mono:        'Geist Mono', ui-monospace, monospace; }
      #ecosystem-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ecosystem-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ecosystem-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="ecosystem-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
          </marker>
          <marker id="ecosystem-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#00F0FF"/>
          </marker>
          <marker id="ecosystem-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#38BDF8"/>
          </marker>
        </defs>

        <!-- Canvas -->
        <rect width="1000" height="500" fill="#060913"/>

        <!-- ZONES (z-order: bg -> zones -> arrows -> nodes) -->
        <!-- Zone 1: Clients -->
        <rect x="24" y="28" width="212" height="368" rx="8" fill="#f8fafc" stroke="#f8fafc" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="40" y="32" width="76" height="14" rx="2" fill="#060913"/>
        <text x="78" y="42" fill="#7C8EA6" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" text-anchor="middle" letter-spacing="0.14em">CLIENTS</text>

        <!-- Zone 2: API & AI Layer -->
        <rect x="276" y="28" width="216" height="368" rx="8" fill="#f8fafc" stroke="#f8fafc" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="292" y="32" width="112" height="14" rx="2" fill="#060913"/>
        <text x="348" y="42" fill="#7C8EA6" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" text-anchor="middle" letter-spacing="0.14em">API &amp; AGENT</text>

        <!-- Zone 3: Core Engine -->
        <rect x="532" y="28" width="216" height="368" rx="8" fill="#f8fafc" stroke="#f8fafc" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="548" y="32" width="112" height="14" rx="2" fill="#060913"/>
        <text x="604" y="42" fill="#7C8EA6" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" text-anchor="middle" letter-spacing="0.14em">CORE ENGINE</text>

        <!-- ARROWS (drawn strictly before nodes; orthogonal only, fanned ports, opaque label masks) -->
        <!-- 1. Desktop/Web UI -> FastAPI REST API (straight horizontal y=124) -->
        <line x1="216" y1="124" x2="292" y2="124" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#ecosystem-architecture-arrow-link)"/>
        <rect x="232" y="102" width="44" height="14" rx="2" fill="#060913"/>
        <text x="254" y="112" fill="#38BDF8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">REST</text>

        <!-- 2. FastAPI REST API -> BYOK Hardware Agent (straight vertical x=384) -->
        <line x1="384" y1="168" x2="384" y2="232" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ecosystem-architecture-arrow)"/>
        <rect x="392" y="192" width="60" height="14" rx="2" fill="#060913"/>
        <text x="422" y="202" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">BYOK KEY</text>

        <!-- 3. FastAPI REST API -> UnifiedSearchClient (straight horizontal y=104) -->
        <line x1="472" y1="104" x2="548" y2="104" stroke="#00F0FF" stroke-width="1.5" marker-end="url(#ecosystem-architecture-arrow-accent)"/>
        <rect x="486" y="82" width="48" height="14" rx="2" fill="#060913"/>
        <text x="510" y="92" fill="#00F0FF" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">SEARCH</text>

        <!-- 4. BYOK Hardware Agent -> UnifiedSearchClient (orthogonal elbow up-right at x=504 into left port y=128) -->
        <path d="M 472,276 H 496 Q 504,276 504,268 V 136 Q 504,128 512,128 H 548" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ecosystem-architecture-arrow)"/>
        <rect x="468" y="196" width="28" height="14" rx="2" fill="#060913"/>
        <text x="482" y="206" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">BOM</text>

        <!-- 5. CLI / SDK / MCP / Bot -> UnifiedSearchClient (routed below Zone 2 along y=360, up clean corridor x=520 into left port y=152; zero box transit) -->
        <path d="M 216,276 H 248 Q 256,276 256,284 V 352 Q 256,360 264,360 H 512 Q 520,360 520,352 V 160 Q 520,152 528,152 H 548" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ecosystem-architecture-arrow)"/>
        <rect x="336" y="340" width="96" height="14" rx="2" fill="#060913"/>
        <text x="384" y="350" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">DIRECT SDK</text>

        <!-- 6. UnifiedSearchClient -> Token & Cache (straight vertical dashed x=640) -->
        <line x1="640" y1="168" x2="640" y2="232" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#ecosystem-architecture-arrow)"/>
        <rect x="648" y="192" width="56" height="14" rx="2" fill="#060913"/>
        <text x="676" y="202" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">CACHE</text>

        <!-- 7. UnifiedSearchClient -> 6 Turkish Markets (straight horizontal headline path y=124) -->
        <line x1="728" y1="124" x2="788" y2="124" stroke="#00F0FF" stroke-width="1.6" marker-end="url(#ecosystem-architecture-arrow-accent)"/>
        <rect x="734" y="102" width="48" height="14" rx="2" fill="#060913"/>
        <text x="758" y="112" fill="#00F0FF" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">6X HTTP</text>

        <!-- NODES (drawn after arrows; opaque paper mask under each box) -->
        <!-- Node 1: Desktop & Web UI -->
        <rect x="44" y="80" width="172" height="88" rx="6" fill="#060913"/>
        <rect x="44" y="80" width="172" height="88" rx="6" fill="#0F172A" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="56" y="92" width="48" height="16" rx="2" fill="#060913" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.14"/>
        <text x="80" y="103" fill="#7C8EA6" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.12em">UI</text>
        <text x="56" y="130" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">Desktop &amp; Web App</text>
        <text x="56" y="150" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Tauri · Vite · React</text>

        <!-- Node 2: CLI / SDK / MCP / Bot -->
        <rect x="44" y="232" width="172" height="88" rx="6" fill="#060913"/>
        <rect x="44" y="232" width="172" height="88" rx="6" fill="#0F172A" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="56" y="244" width="68" height="16" rx="2" fill="#060913" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.14"/>
        <text x="90" y="255" fill="#7C8EA6" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.12em">INTERFACES</text>
        <text x="56" y="282" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">CLI, SDK, MCP &amp; Bot</text>
        <text x="56" y="302" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">robo-search · robo-mcp</text>

        <!-- Node 3: FastAPI REST API -->
        <rect x="296" y="80" width="176" height="88" rx="6" fill="#060913"/>
        <rect x="296" y="80" width="176" height="88" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <rect x="308" y="92" width="60" height="16" rx="2" fill="#060913" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
        <text x="338" y="103" fill="#38BDF8" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.12em">REST API</text>
        <text x="308" y="130" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">robo_market_api</text>
        <text x="308" y="150" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">FastAPI · OpenAPI :8000</text>

        <!-- Node 4: BYOK Hardware Agent -->
        <rect x="296" y="232" width="176" height="88" rx="6" fill="#060913"/>
        <rect x="296" y="232" width="176" height="88" rx="6" fill="#0F172A" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="308" y="244" width="60" height="16" rx="2" fill="#060913" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.14"/>
        <text x="338" y="255" fill="#7C8EA6" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.12em">AI AGENT</text>
        <text x="308" y="282" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">BYOK Hardware Agent</text>
        <text x="308" y="302" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">7-Step BOM · 6 LLMs</text>

        <!-- Node 5: FOCAL UnifiedSearchClient -->
        <rect x="552" y="80" width="176" height="88" rx="6" fill="#060913"/>
        <rect x="552" y="80" width="176" height="88" rx="6" fill="#00f0ff" stroke="#00F0FF" stroke-width="1.6" fill-opacity="0.08"/>
        <rect x="564" y="92" width="64" height="16" rx="2" fill="#060913" stroke="#00F0FF" stroke-width="1"/>
        <text x="596" y="103" fill="#00F0FF" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="0.12em">CORE HUB</text>
        <text x="564" y="130" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">UnifiedSearchClient</text>
        <text x="564" y="150" fill="#00F0FF" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">ThreadPool · cart_search</text>

        <!-- Node 6: Token & Cache -->
        <rect x="552" y="232" width="176" height="88" rx="6" fill="#060913"/>
        <rect x="552" y="232" width="176" height="88" rx="6" fill="#0F172A" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="564" y="244" width="64" height="16" rx="2" fill="#060913" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.14"/>
        <text x="596" y="255" fill="#7C8EA6" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.12em">SUPPORT</text>
        <text x="564" y="282" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">Token &amp; SQLite Cache</text>
        <text x="564" y="302" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Auto Refresh · TTL 2h</text>

        <!-- Node 7: 6 Live Turkish Markets (External) -->
        <rect x="792" y="64" width="184" height="256" rx="6" fill="#060913"/>
        <rect x="792" y="64" width="184" height="256" rx="6" fill="#0B1120" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="5,3"/>
        <rect x="804" y="76" width="84" height="16" rx="2" fill="#060913" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
        <text x="846" y="87" fill="#38BDF8" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.12em">6 LIVE STORES</text>
        <text x="804" y="116" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">Turkish Markets</text>

        <!-- Store rows inside external box -->
        <circle cx="812" cy="144" r="3.5" fill="#E63946"/><text x="824" y="148" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">robotistan.com</text>
        <circle cx="812" cy="172" r="3.5" fill="#457B9D"/><text x="824" y="176" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">robolinkmarket.com</text>
        <circle cx="812" cy="200" r="3.5" fill="#2A9D8F"/><text x="824" y="204" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">robo90.com</text>
        <circle cx="812" cy="228" r="3.5" fill="#E76F51"/><text x="824" y="232" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">direnc.net</text>
        <circle cx="812" cy="256" r="3.5" fill="#0077B6"/><text x="824" y="260" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">ozdisan.com</text>
        <circle cx="812" cy="284" r="3.5" fill="#F4A261"/><text x="824" y="288" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">motorobit.com</text>

        <!-- Bottom Legend Strip -->
        <line x1="24" y1="432" x2="976" y2="432" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.14"/>
        <rect x="24" y="452" width="12" height="12" rx="2" fill="#00f0ff" stroke="#00F0FF" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="44" y="462" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">FOCAL CORE HUB</text>

        <line x1="176" y1="458" x2="208" y2="458" stroke="#00F0FF" stroke-width="1.5" marker-end="url(#ecosystem-architecture-arrow-accent)"/>
        <text x="216" y="462" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">PRIMARY SEARCH PATH</text>

        <line x1="376" y1="458" x2="408" y2="458" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#ecosystem-architecture-arrow-link)"/>
        <text x="416" y="462" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">HTTP / EXTERNAL</text>

        <line x1="548" y1="458" x2="580" y2="458" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ecosystem-architecture-arrow)"/>
        <text x="588" y="462" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">CACHE / TOKEN REFRESH</text>
      </svg>
