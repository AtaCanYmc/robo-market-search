<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-search-sequence-title mcp-search-sequence-desc" id="mcp-search-sequence-root">
        <title id="mcp-search-sequence-title">MCP and Parallel Store Search Sequence</title>
        <desc id="mcp-search-sequence-desc">Time-ordered sequence showing a user prompt flowing through an LLM, robo-mcp, and UnifiedSearchClient to query 6 Turkish electronics stores in parallel and return ranked prices.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #mcp-search-sequence-root { --color-paper:      #060913;
      --color-paper-2:    #0F172A;
      --color-ink:        #F8FAFC;
      --color-muted:      #94A3B8;
      --color-soft:       #7C8EA6;
      --color-rule:       rgba(248, 250, 252, 0.14);
      --color-rule-solid: rgba(148, 163, 184, 0.32);
      --color-accent:     #00F0FF;
      --color-accent-tint:rgba(0, 240, 255, 0.08);
      --color-link:       #38BDF8;
      --font-sans:        'Geist', system-ui, sans-serif;
      --font-serif:       'Instrument Serif', serif;
      --font-mono:        'Geist Mono', ui-monospace, monospace; }
      #mcp-search-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #mcp-search-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#mcp-search-sequence-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="mcp-search-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
          </marker>
          <marker id="mcp-search-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#00F0FF"/>
          </marker>
          <marker id="mcp-search-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#38BDF8"/>
          </marker>
        </defs>

        <!-- Canvas -->
        <rect width="1000" height="568" fill="#060913"/>

        <!-- Lifelines (5 actors: x=108, 304, 500, 696, 892) -->
        <line x1="108" y1="84" x2="108" y2="492" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="304" y1="84" x2="304" y2="492" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="500" y1="84" x2="500" y2="492" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="696" y1="84" x2="696" y2="492" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="892" y1="84" x2="892" y2="492" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Combined Fragment: LOOP [6 stores in parallel] spanning UnifiedSearchClient (696) and 6 Markets (892) -->
        <rect x="624" y="216" width="300" height="108" rx="4" fill="#f8fafc" stroke="#f8fafc" stroke-width="1" fill-opacity="0.04" stroke-opacity="0.22"/>
        <rect x="624" y="216" width="48" height="16" rx="2" fill="#060913" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.22"/>
        <text x="648" y="227" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="716" y="228" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.04em">[6 stores via ThreadPool]</text>

        <!-- Activation Bars -->
        <rect x="300" y="120" width="8" height="352" fill="#f8fafc" stroke="#94A3B8" stroke-width="0.8" fill-opacity="0.08"/>
        <rect x="496" y="156" width="8" height="276" fill="#f8fafc" stroke="#94A3B8" stroke-width="0.8" fill-opacity="0.08"/>
        <rect x="692" y="192" width="8" height="204" fill="#00f0ff" stroke="#00F0FF" stroke-width="0.9" fill-opacity="0.14"/>
        <rect x="888" y="264" width="8" height="44" fill="#38bdf8" stroke="#38BDF8" stroke-width="0.8" fill-opacity="0.14"/>

        <!-- Messages (top -> down; labels on opaque mask with 8px gap above line) -->
        <!-- 1. User -> LLM -->
        <line x1="112" y1="124" x2="296" y2="124" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#mcp-search-sequence-arrow)"/>
        <rect x="132" y="102" width="144" height="14" rx="2" fill="#060913"/>
        <text x="204" y="112" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">CHEAPEST ESP32</text>

        <!-- 2. LLM -> robo-mcp -->
        <line x1="308" y1="160" x2="492" y2="160" stroke="#38BDF8" stroke-width="1.3" marker-end="url(#mcp-search-sequence-arrow-link)"/>
        <rect x="328" y="138" width="144" height="14" rx="2" fill="#060913"/>
        <text x="400" y="148" fill="#38BDF8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">SEARCH_PRODUCTS</text>

        <!-- 3. robo-mcp -> UnifiedSearchClient -->
        <line x1="504" y1="196" x2="688" y2="196" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#mcp-search-sequence-arrow)"/>
        <rect x="528" y="174" width="136" height="14" rx="2" fill="#060913"/>
        <text x="596" y="184" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">SEARCH("ESP32")</text>

        <!-- 4. UnifiedSearchClient -> 6 Markets (inside LOOP) -->
        <line x1="700" y1="264" x2="884" y2="264" stroke="#38BDF8" stroke-width="1.3" marker-end="url(#mcp-search-sequence-arrow-link)"/>
        <rect x="728" y="242" width="128" height="14" rx="2" fill="#060913"/>
        <text x="792" y="252" fill="#38BDF8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">GET / SCRAPE</text>

        <!-- 5. 6 Markets -> UnifiedSearchClient (return: dashed + filled arrowhead) -->
        <line x1="888" y1="308" x2="704" y2="308" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mcp-search-sequence-arrow)"/>
        <rect x="732" y="286" width="120" height="14" rx="2" fill="#060913"/>
        <text x="792" y="296" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">RAW PRODUCTS</text>

        <!-- 6. Self-message on UnifiedSearchClient: Sort & Normalize -->
        <path d="M 700,340 H 732 Q 740,340 740,348 V 364 Q 740,372 732,372 H 704" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#mcp-search-sequence-arrow)"/>
        <rect x="748" y="348" width="120" height="14" rx="2" fill="#060913"/>
        <text x="808" y="358" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">SORT PRICE ASC</text>

        <!-- 7. UnifiedSearchClient -> robo-mcp (return) -->
        <line x1="692" y1="396" x2="508" y2="396" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mcp-search-sequence-arrow)"/>
        <rect x="536" y="374" width="120" height="14" rx="2" fill="#060913"/>
        <text x="596" y="384" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">RANKED LIST</text>

        <!-- 8. robo-mcp -> LLM (return) -->
        <line x1="496" y1="432" x2="312" y2="432" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mcp-search-sequence-arrow)"/>
        <rect x="344" y="410" width="112" height="14" rx="2" fill="#060913"/>
        <text x="400" y="420" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">JSON RESULT</text>

        <!-- 9. LLM -> User (Headline Success - single focal accent arrow) -->
        <line x1="300" y1="468" x2="112" y2="468" stroke="#00F0FF" stroke-width="1.6" marker-end="url(#mcp-search-sequence-arrow-accent)"/>
        <rect x="132" y="446" width="144" height="14" rx="2" fill="#060913"/>
        <text x="204" y="456" fill="#00F0FF" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.06em">BEST: 159.60 TL</text>

        <!-- ACTOR BOXES (top row y=28, height=56) -->
        <!-- Actor 1: User -->
        <rect x="32" y="28" width="152" height="56" rx="6" fill="#060913"/>
        <rect x="32" y="28" width="152" height="56" rx="6" fill="#0F172A" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.32"/>
        <text x="108" y="54" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">User</text>
        <text x="108" y="70" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">Prompt</text>

        <!-- Actor 2: Claude / LLM -->
        <rect x="228" y="28" width="152" height="56" rx="6" fill="#060913"/>
        <rect x="228" y="28" width="152" height="56" rx="6" fill="#0F172A" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.32"/>
        <text x="304" y="54" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Claude / LLM</text>
        <text x="304" y="70" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">MCP Host</text>

        <!-- Actor 3: robo-mcp -->
        <rect x="424" y="28" width="152" height="56" rx="6" fill="#060913"/>
        <rect x="424" y="28" width="152" height="56" rx="6" fill="#0F172A" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.32"/>
        <text x="500" y="54" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">robo-mcp</text>
        <text x="500" y="70" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">MCP Server</text>

        <!-- Actor 4: UnifiedSearchClient (Focal) -->
        <rect x="620" y="28" width="152" height="56" rx="6" fill="#060913"/>
        <rect x="620" y="28" width="152" height="56" rx="6" fill="#00f0ff" stroke="#00F0FF" stroke-width="1.4" fill-opacity="0.08"/>
        <text x="696" y="54" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">UnifiedSearch</text>
        <text x="696" y="70" fill="#00F0FF" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">Core Client</text>

        <!-- Actor 5: 6 Markets -->
        <rect x="816" y="28" width="152" height="56" rx="6" fill="#060913"/>
        <rect x="816" y="28" width="152" height="56" rx="6" fill="#0B1120" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="892" y="54" fill="#F8FAFC" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">6 Markets</text>
        <text x="892" y="70" fill="#38BDF8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">Live Scrapers</text>

        <!-- Bottom Legend Strip -->
        <line x1="32" y1="516" x2="968" y2="516" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.14"/>
        <line x1="32" y1="538" x2="64" y2="538" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#mcp-search-sequence-arrow)"/>
        <text x="72" y="542" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SYNC CALL</text>

        <line x1="172" y1="538" x2="204" y2="538" stroke="#38BDF8" stroke-width="1.3" marker-end="url(#mcp-search-sequence-arrow-link)"/>
        <text x="212" y="542" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">MCP / HTTP REQUEST</text>

        <line x1="376" y1="538" x2="408" y2="538" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mcp-search-sequence-arrow)"/>
        <text x="416" y="542" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">RETURN</text>

        <line x1="496" y1="538" x2="528" y2="538" stroke="#00F0FF" stroke-width="1.6" marker-end="url(#mcp-search-sequence-arrow-accent)"/>
        <text x="536" y="542" fill="#94A3B8" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">RANKED ANSWER</text>
      </svg>
