[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-market-search-demo"
version = "1.0.0"
description = "FastAPI + Jinja2 + HTMX web demo application for robo-market-search"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Ata Can", email = "atacanymc@gmail.com" },
]
dependencies = [
    "robo-market-search",
    "fastapi>=0.162.6",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[project.scripts]
robo-demo = "main:app"

[tool.setuptools.packages.find]
where = ["."]
