version: 2

updates:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Root Python Dependencies (pyproject.toml, requirements.txt)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-production:
        dependency-type: "production"
        patterns:
          - "*"
      python-optional:
        dependency-type: "development"
        patterns:
          - "*"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Demo App Python Dependencies (demo/pyproject.toml, demo/requirements.txt)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/demo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "python"
      - "demo"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Demo Backend Python Dependencies (demo/backend/requirements.txt)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/demo/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "python"
      - "backend"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Frontend npm Dependencies (demo/frontend/package.json)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/demo/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Root Docker & Docker Compose (Dockerfile, docker-compose.yml)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Demo Docker Compose (demo/docker-compose.yml)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "demo"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Demo Backend Dockerfile (demo/backend/Dockerfile)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/demo/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Demo Frontend Dockerfile (demo/frontend/Dockerfile)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/demo/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 9. GitHub Actions Workflows (.github/workflows)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
