[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-market-search"
version = "1.7.0"
authors = [
    { name = "Ata Can", email = "atacanymc@gmail.com" },
]
description = "A unified Python library and AI Agent system to search Robolink, Robotistan, Robo90, and Direncnet."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "curl_cffi>=0.5.10",
    "beautifulsoup4"
]
license = { text = "Apache-2.0" }
keywords = ["robotistan", "robolink", "robo90", "direncnet", "search", "scraper", "api", "mcp", "bot", "cli", "python", "library", "agent", "bom"]

[project.optional-dependencies]
cli = ["typer", "rich"]
mcp = ["mcp; python_version >= '3.10'", "anyio"]
bot = ["aiogram"]
agent = ["pydantic>=2.0", "typer", "rich", "openai>=1.0.0", "groq>=0.4.0", "anthropic>=0.18.0", "google-generativeai>=0.4.0", "ollama>=0.1.0"]
api = ["fastapi", "uvicorn[standard]", "pydantic-settings>=2.0"]
all = ["typer", "rich", "mcp; python_version >= '3.10'", "anyio", "aiogram", "pydantic>=2.0", "fastapi", "uvicorn[standard]", "pydantic-settings>=2.0", "openai>=1.0.0", "groq>=0.4.0", "anthropic>=0.18.0", "google-generativeai>=0.4.0", "ollama>=0.1.0"]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
    "types-beautifulsoup4",
    "pytest",
    "pytest-cov",
    "httpx",
]

[project.scripts]
robo-search = "robo_market_search.cli.main:app"
robo-mcp = "robo_market_search.mcp.server:main"
robo-bot = "robo_market_search.bot.server:main"
robo-agent = "robo_market_agent.cli:app"
robo-api = "robo_market_api.app.main:cli_main"

[project.urls]
"Homepage" = "https://github.com/AtaCanYmc/robo-market-search"

[tool.setuptools.packages.find]
include = ["robo_market_search", "robo_market_search.*", "robo_market_service", "robo_market_service.*", "robo_market_agent", "robo_market_agent.*", "robo_market_api", "robo_market_api.*"]

[tool.setuptools.package-data]
"robo_market_agent" = ["prompts/*.txt", "prompts/*"]


[tool.ruff]
target-version = "py38"
line-length = 127
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
    "examples",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = [
    "UP006",
    "UP007",
    "UP045",
    "UP035",
    "E501",
    "E722",
    "RUF012",
    "SIM108",
    "B904",
    "RUF001",
    "RUF002",
    "RUF003",
    "TC001",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["ALL"]
"demo/*" = [
    "B008",
]
"robo_market_search/bot/*" = [
    "B008",
]
"robo_market_search/cli/*" = [
    "B008",
    "UP",
]
"robo_market_search/cart/*" = [
    "B008",
    "UP",
]
"robo_market_agent/cli.py" = [
    "B008",
]
"robo_market_api/*" = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["robo_market_search", "robo_market_service", "robo_market_agent"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
python_version = "3.8"
mypy_path = "."
show_error_codes       = true
show_column_numbers    = true
pretty                 = true
error_summary          = false
warn_return_any        = true
warn_unused_configs    = true
warn_redundant_casts   = true
warn_unused_ignores    = false
ignore_missing_imports = true
disallow_untyped_defs       = false
disallow_incomplete_defs    = false
check_untyped_defs          = true
disallow_any_generics       = false

[[tool.mypy.overrides]]
module = [
    "robo_market_search.shared.*",
    "robo_market_search.unified.*",
    "robo_market_service.*",
]
disallow_untyped_defs    = true
disallow_incomplete_defs = true
warn_return_any          = true
