name: Automated Scraper Health Check

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch:  # Manuel tetikleme imkanı

jobs:
  health-check:
    name: 🏥 Scraper DOM & API Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: healthcheck-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            healthcheck-pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Baseline Health Check
        run: |
          python examples/health_check.py "10K direnç"
