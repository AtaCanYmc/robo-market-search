name: Publish Python 🐍 distribution 📦 to PyPI

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: This workflow is now superseded by release-please.yml.
#
# release-please.yml handles both versioning AND publishing:
#   1. On every push to `main`, release-please analyses Conventional Commits.
#   2. It opens / updates a "Release PR" that bumps the version and CHANGELOG.
#   3. When that PR is merged, it creates a GitHub Release + tag, then
#      immediately runs the build → publish-to-pypi jobs defined in
#      release-please.yml.
#
# This file is kept as a MANUAL / EMERGENCY fallback only.
# You can trigger it manually from the Actions tab via workflow_dispatch.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (pypi or testpypi)"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pypa/build
        run: python -m pip install build --user

      - name: Clean old distributions
        run: rm -rf dist/

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://pypi.org/project/robo-market-search/

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          repository-url: ${{ github.event.inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # If not using Trusted Publishing, uncomment:
          # password: ${{ secrets.PYPI_API_TOKEN }}
