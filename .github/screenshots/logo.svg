<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="40%" stop-color="#080E1E" />
      <stop offset="100%" stop-color="#03060D" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#0099FF" />
      <stop offset="85%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Radar Ring Main Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Center Pulse Gradient -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Outer Modern Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- 2. Circuit Board Traces (Hardware Aesthetic) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Circuit Lines -->
    <path d="M 64 140 L 120 140 L 160 175 L 180 175" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="64" cy="140" r="5" fill="#00F0FF" fill-opacity="0.8" />

    <path d="M 64 372 L 115 372 L 155 335 L 175 335" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="64" cy="372" r="5" fill="#00F0FF" fill-opacity="0.8" />

    <!-- Right Circuit Lines -->
    <path d="M 448 140 L 392 140 L 352 175 L 332 175" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="448" cy="140" r="5" fill="#00F0FF" fill-opacity="0.8" />

    <path d="M 448 320 L 400 320 L 368 285" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="448" cy="320" r="5" fill="#3b82f6" fill-opacity="0.8" />
  </g>

  <!-- 3. Radar Background Glow -->
  <circle cx="236" cy="236" r="140" fill="url(#pulseGlow)" />

  <!-- 4. Outer Dashed Sonar / Target Ring -->
  <circle cx="236" cy="236" r="126" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6 8" stroke-opacity="0.35" />

  <!-- 5. Main Glowing Radar / Lens Ring -->
  <circle cx="236" cy="236" r="102" fill="none" stroke="url(#ringGrad)" stroke-width="22" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- 6. Inner Dark Recess -->
  <circle cx="236" cy="236" r="88" fill="#060A14" />

  <!-- 7. Intermediate Dashed Targeting Track -->
  <circle cx="236" cy="236" r="66" fill="none" stroke="#00F0FF" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round" />

  <!-- 8. Precision Crosshairs -->
  <g stroke="#00F0FF" stroke-width="6" stroke-linecap="round">
    <line x1="236" y1="148" x2="236" y2="178" />
    <line x1="236" y1="294" x2="236" y2="324" />
    <line x1="148" y1="236" x2="178" y2="236" />
    <line x1="294" y1="236" x2="324" y2="236" />
  </g>

  <!-- 9. Center Sensor / Core Core -->
  <circle cx="236" cy="236" r="32" fill="none" stroke="#00F0FF" stroke-width="10" />
  <circle cx="236" cy="236" r="11" fill="#FFFFFF" />

  <!-- 10. Modern Search Lens Handle (Angle 45°) -->
  <g transform="rotate(-45 236 236)">
    <!-- Shadow / Glow behind handle -->
    <rect x="220" y="342" width="32" height="100" rx="16" fill="#00F0FF" filter="url(#neonGlow)" opacity="0.4" />
    <!-- Handle Body -->
    <rect x="220" y="342" width="32" height="100" rx="16" fill="#0B132B" stroke="#00F0FF" stroke-width="8" />
    <!-- Handle Accent Dot -->
    <circle cx="236" cy="418" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- 11. Lens Specular Light Reflection -->
  <path d="M 314 168 A 102 102 0 0 1 336 226" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
