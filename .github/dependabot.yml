version: 2

updates:
  # ──────────────────────────────────────────────────────────────────────────
  # Python pip dependencies (Root & Demo)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-production:
        dependency-type: "production"
        patterns:
          - "*"
      python-optional:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      - dependency-name: "curl_cffi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "beautifulsoup4"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/demo/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend npm dependencies
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/demo/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # GitHub Actions (keep action versions up to date)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      # Bundle all GitHub Actions updates into one PR per week
      github-actions:
        patterns:
          - "*"
