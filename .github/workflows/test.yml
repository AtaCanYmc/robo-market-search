name: Python CI Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint & Type Check (ruff + mypy via pre-commit)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (ruff lint + ruff format + mypy)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: conventional-pre-commit   # commit-msg hook — CI'da geçersiz

  # ──────────────────────────────────────────────────────────────────────────
  # Multi-version Build & Install Test
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint          # Lint geçmeden testlere gitme
    strategy:
      fail-fast: false   # Bir versiyon başarısız olsa diğerleri devam etsin
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install package with all optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Verify import
        run: python -c "import robo_market_search; print('✅ Import OK')"

      - name: Run tests (if any)
        run: |
          if command -v pytest &> /dev/null || pip show pytest &> /dev/null; then
            pytest --tb=short -q || true
          else
            echo "ℹ️  pytest bulunamadı, kurulum testi yeterli."
          fi
