<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14" />
      <stop offset="50%" stop-color="#0E162A" />
      <stop offset="100%" stop-color="#090E1C" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Accent Neon Gradient -->
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Container Frame -->
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="14" />

  <!-- 2. Ambient Light Core -->
  <circle cx="230" cy="230" r="160" fill="url(#coreGlow)" />

  <!-- 3. Microchip PCB Traces -->
  <g stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6">
    <!-- Top left trace -->
    <path d="M 60 140 L 110 140 L 140 170" />
    <circle cx="60" cy="140" r="6" fill="#00F0FF" />

    <!-- Top right trace -->
    <path d="M 452 140 L 390 140 L 360 170" />
    <circle cx="452" cy="140" r="6" fill="#38BDF8" />

    <!-- Bottom left trace -->
    <path d="M 60 370 L 120 370 L 160 330" />
    <circle cx="60" cy="370" r="6" fill="#00F0FF" />

    <!-- Right trace -->
    <path d="M 452 320 L 400 320 L 370 290" />
    <circle cx="452" cy="320" r="6" fill="#818CF8" />
  </g>

  <!-- 4. Modern Scanner / Radar Lens (Centered slightly offset for handle balance) -->
  <g transform="translate(224, 224)">
    <!-- Outer Precision Orbit Track -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="#1E293B" stroke-width="6" stroke-dasharray="14 10" />

    <!-- Outer Primary Neon Ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#favAccent)" stroke-width="18" filter="url(#glow)" />

    <!-- Inner Dashed HUD Tech Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#38BDF8" stroke-width="7" stroke-dasharray="28 14" opacity="0.85" />

    <!-- Precision Crosshair Markers -->
    <line x1="-92" y1="0" x2="-68" y2="0" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" />
    <line x1="68" y1="0" x2="92" y2="0" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="-92" x2="0" y2="-68" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="68" x2="0" y2="92" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" />

    <!-- Inner Core Housing -->
    <circle cx="0" cy="0" r="44" fill="#080D1A" stroke="#00F0FF" stroke-width="8" filter="url(#glow)" />

    <!-- Center Radiant Eye -->
    <circle cx="0" cy="0" r="22" fill="#00F0FF" />
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" />

    <!-- Diagonal Magnifier / Probe Handle -->
    <g transform="rotate(45)">
      <rect x="95" y="-18" width="92" height="36" rx="18" fill="#131D31" stroke="url(#favAccent)" stroke-width="8" />
      <line x1="118" y1="0" x2="162" y2="0" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
      <circle cx="170" cy="0" r="4" fill="#FFFFFF" />
    </g>
  </g>
</svg>
