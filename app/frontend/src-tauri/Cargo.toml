[package]
name = "robo-market-search-desktop"
version = "1.14.0"
description = "Robo Market Search Desktop App"
authors = ["Ata Can"]
edition = "2021"

[lib]
name = "robo_market_search_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
