[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-market-search-demo"
version = "1.0.0"
description = "FastAPI + Jinja2 + HTMX web demo application for robo-market-search"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Ata Can", email = "atacanymc@gmail.com" },
]
dependencies = [
    "robo-market-search>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
robo-demo = "main:app"

[tool.setuptools.packages.find]
where = ["."]
