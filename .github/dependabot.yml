version: 2

updates:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Root Python Dependencies (pyproject.toml, requirements.txt)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-production:
        dependency-type: "production"
        patterns:
          - "*"
      python-optional:
        dependency-type: "development"
        patterns:
          - "*"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. App Backend Python Dependencies (app/backend/requirements.txt)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "python"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # ──────────────────────────────────────────────────────────────────────────
  # 3. App Frontend npm Dependencies (app/frontend/package.json)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Root Docker & Docker Compose (Dockerfile, docker-compose.yml)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 5. App Docker Compose (app/docker-compose.yml)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "app"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 6. App Backend Dockerfile (app/backend/Dockerfile)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 7. App Frontend Dockerfile (app/frontend/Dockerfile)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"

  # ──────────────────────────────────────────────────────────────────────────
  # 9. GitHub Actions Workflows (.github/workflows)
  # ──────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
